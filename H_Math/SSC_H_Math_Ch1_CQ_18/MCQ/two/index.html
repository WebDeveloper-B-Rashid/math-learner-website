    <style>
        /* Modern, Clean, and Professional CSS */
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --success-bg: #dcfce7;
            --success-border: #22c55e;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-border: #ef4444;
            --error-text: #991b1b;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Business Marquee Header */
        .marquee-wrapper {
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .marquee-content {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 22s linear infinite;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Page Layout */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .header-titles {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header-titles h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header-titles p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* 2-Column Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .q-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .lang-col {
            display: flex;
            flex-direction: column;
        }

        .col-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .q-text {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* Options Framework */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .option-label:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }

        .option-label input[type="radio"] {
            margin-top: 5px;
            transform: scale(1.2);
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Action Row */
        .action-row {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: center;
        }

        .check-btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            max-width: 400px;
        }

        .check-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Solution Area */
        .solution-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid;
            animation: slideDown 0.3s ease;
        }

        .feedback-badge {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .status-correct {
            background-color: var(--success-bg);
            border-color: var(--success-border);
        }
        .status-correct .feedback-badge { color: var(--success-text); }

        .status-wrong {
            background-color: var(--error-bg);
            border-color: var(--error-border);
        }
        .status-wrong .feedback-badge { color: var(--error-text); }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile First Responsiveness */
        @media (max-width: 850px) {
            .q-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .question-card {
                padding: 1.5rem;
            }
            .action-row {
                margin-top: 1rem;
            }
        }
    </style>
</head>

        // Renders the quiz layout dynamically

            const prefixBn = ['(ক)', '(খ)', '(গ)', '(ঘ)'];
            const prefixEn = ['(a)', '(b)', '(c)', '(d)'];

            quizData.forEach((q, index) => {
                const qNum = index + 1;
                
                let optsBnHtml = '';
                let optsEnHtml = '';

                // Generate Options mapping identical "names" so checking English/Bangla syncs selection logically
                for (let i = 0; i < 4; i++) {
                    optsBnHtml += `
                        <label class="option-label">
                            <input type="radio" name="q${qNum}" value="${i}">
                            <span>${prefixBn[i]} ${q.oB[i]}</span>
                        </label>`;
                    optsEnHtml += `
                        <label class="option-label">
                            <input type="radio" name="q${qNum}" value="${i}">
                            <span>${prefixEn[i]} ${q.oE[i]}</span>
                        </label>`;
                }

                // Construct full card block
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${qNum}`;
                card.innerHTML = `
                    <div class="q-grid">
                        <div class="lang-col">
                            <div class="col-header">Bangla Version</div>
                            <div class="q-text"><strong>প্রশ্ন ${qNum}:</strong> ${q.qB}</div>
                            <div class="options-group">${optsBnHtml}</div>
                        </div>
                        
                        <div class="lang-col">
                            <div class="col-header">English Version</div>
                            <div class="q-text"><strong>Q${qNum}:</strong> ${q.qE}</div>
                            <div class="options-group">${optsEnHtml}</div>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="check-btn" onclick="checkAnswer(${qNum}, ${q.ans})">
                            Check Answer / উত্তর দেখুন
                        </button>
                    </div>

                    <div class="solution-box" id="sol-${qNum}" style="display: none;">
                        <div class="feedback-badge" id="badge-${qNum}"></div>
                        <div class="q-grid">
                            <div class="lang-col">
                                <div class="col-header" style="color: inherit;">সমাধান</div>
                                <div>${q.sB}</div>
                            </div>
                            <div class="lang-col">
                                <div class="col-header" style="color: inherit;">Solution</div>
                                <div>${q.sE}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Trigger MathJax parsing on dynamically injected content
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });

        /**
         * Validates the selected input by retrieving the radio value.
         */
        function checkAnswer(questionNum, correctValue) {
            const card = document.getElementById(`card-${questionNum}`);
            const solBox = document.getElementById(`sol-${questionNum}`);
            const badge = document.getElementById(`badge-${questionNum}`);
            
            const selectedOpt = card.querySelector(`input[name="q${questionNum}"]:checked`);
            
            if (!selectedOpt) {
                alert("Please select an option first! / প্রথমে একটি অপশন নির্বাচন করুন!");
                return;
            }

            // Remove previous styling
            solBox.classList.remove('status-correct', 'status-wrong');
            solBox.style.display = "block"; // Reveal Solution

            if (parseInt(selectedOpt.value) === correctValue) {
                solBox.classList.add('status-correct');
                badge.textContent = "✓ Correct Answer! / সঠিক উত্তর!";
            } else {
                solBox.classList.add('status-wrong');
                badge.textContent = "✗ Incorrect! / ভুল উত্তর!";
            }
        }
